<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eñe 西语单词</title>
  <meta name="description" content="只学单词的西班牙语 App：单词卡 + 按遗忘规律复习，拉美通用说法。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <!-- 外观（白色 / 黑色）要在页面画出来之前就设好，避免闪一下 -->
  <script>
    (function () {
      try {
        var s = (JSON.parse(localStorage.getItem('ene-progress-v1') || '{}') || {}).settings || {};
        var t = s.theme;
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < m.length; i++) m[i].setAttribute('content', t === 'dark' ? '#000000' : '#FFFFFF');
        }
      } catch (e) {}
    })();
  </script>
  <!-- 添加到主屏幕（iPhone） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Eñe">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <!-- 直接双击打开（file://）时浏览器不让读 manifest，所以只在网址打开时加上 -->
  <script>if (location.protocol !== 'file:') document.write('<link rel="manifest" href="manifest.webmanifest">');</script>
