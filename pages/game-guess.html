<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>猜单词 · 我的西语学习站</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/skin-early.js"></script>
  <!-- 离线网站 / 添加到主屏幕（由 tools/build-web.ps1 加入） -->
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="西语学习">
  <meta name="theme-color" content="#f7faf4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121a14" media="(prefers-color-scheme: dark)">
</head>
<body>
  <div class="container">
    <div class="game-top-links">
      <a class="back-link" href="../index.html">‹ 返回首页</a>
      <a class="back-link" href="games.html">🎮 游戏大厅</a>
    </div>

    <h1>🔤 猜单词</h1>

    <div id="setup-screen">
      <p>看中文提示，一个一个字母猜出西语单词。重音字母当普通字母：猜 a 也会揭开 á。<br>
        每个词有 6 颗 ❤️，猜错一次少一颗；猜出来时剩几颗就得几分。每轮 5 个词，满分 30 分。</p>
      <p class="game-best" id="best-line"></p>
      <h2>选择范围</h2>
      <div class="quiz-check-list" id="scope-box"></div>
      <div id="setup-error"></div>
      <div class="card-nav">
        <button type="button" class="btn quiz-big-btn" id="start-btn">开始 ▶</button>
      </div>
    </div>

    <div id="play-screen" hidden>
      <div class="game-hud">
        <span>第 <span class="hud-strong" id="h-num"></span> / <span id="h-total"></span> 个词</span>
        <span>得分：<span class="hud-strong" id="h-score">0</span></span>
      </div>
      <div class="quiz-question">
        <div class="quiz-prompt-label">这个词的西语是什么？</div>
        <div class="guess-hint" id="q-zh"></div>
        <div class="guess-word" id="q-word" aria-live="polite"></div>
        <div class="hearts" id="q-hearts" aria-live="polite"></div>
      </div>
      <div class="guess-keys" id="keys" role="group" aria-label="字母键盘"></div>
      <!-- 阶段 12：也可以用手机自带的键盘：点按钮弹出键盘，打一个字母就猜一个（重音字母当普通字母） -->
      <div class="kb-guess">
        <button type="button" class="btn btn-light btn-small" id="kb-btn">⌨️ 用键盘输入</button>
        <input type="text" class="text-input kb-guess-input" id="kb-input" hidden autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" lang="es" inputmode="text" enterkeyhint="next" aria-label="打一个字母就猜一个" placeholder="打一个字母">
      </div>
      <div class="quiz-feedback" id="feedback" hidden></div>
      <div class="card-nav">
        <button type="button" class="btn quiz-big-btn" id="next-btn" hidden>下一个词 →</button>
      </div>
      <p class="key-hint muted">电脑键盘：直接打字母（也可以打 ñ 或带重音的字母），回车下一个词</p>
    </div>

    <div id="result-screen" hidden>
      <div class="quiz-result">
        <div class="quiz-result-label">这一轮完成！你的得分</div>
        <div class="quiz-result-score" id="r-score"></div>
        <div class="quiz-result-msg" id="r-detail"></div>
        <div class="game-new-record" id="r-record" hidden></div>
        <div class="quiz-result-msg muted" id="r-best"></div>
      </div>
      <div class="game-list-box" id="r-list"></div>
      <div class="card-nav">
        <button type="button" class="btn" id="again-btn">🔁 再来一局</button>
        <button type="button" class="btn btn-light" id="setup-btn">换范围</button>
        <a class="btn btn-light btn-link" href="games.html">返回游戏大厅</a>
      </div>
    </div>
  </div>

  <script src="../js/claude-bridge.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/sfx.js"></script>
  <script src="../js/mascot.js"></script>
  <script src="../data/words.js"></script>
  <script src="../js/speak.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/words-util.js"></script>
  <script src="../js/games.js"></script>
  <script src="../js/pwa.js"></script>
  <script>
    var U = window.WordsUtil, K = window.GameKit;
    var el = U.el;
    function $(id) { return document.getElementById(id); }
    var ROUND = 5, HEARTS = 6, MIN_LEN = 3;
    // 西语字母顺序：n 后面是 ñ
    var LETTERS = "abcdefghijklmnñopqrstuvwxyz".split("");
    var ACCENT = { "á": "a", "à": "a", "â": "a", "ä": "a", "é": "e", "è": "e", "ê": "e", "ë": "e",
      "í": "i", "ì": "i", "î": "i", "ï": "i", "ó": "o", "ò": "o", "ô": "o", "ö": "o", "ú": "u", "ù": "u", "û": "u", "ü": "u" };
    // 重音字母当普通字母；ñ 是单独的字母，不算 n
    function base(ch) {
      var c = String(ch || "").toLowerCase();
      return ACCENT[c] || c;
    }

    // 去掉冠词 el / la / los / las；剩下的必须是一个单词（只有字母，至少 3 个）
    function answerOf(es) {
      var s = String(es || "").trim().replace(/^(el|la|los|las)\s+/i, "");
      if (!/^[a-záéíóúüñ]+$/i.test(s)) return null;
      return s.length >= MIN_LEN ? s : null;
    }

    var scope = null;
    var round = [];   // [{ item, answer }]
    var pos = 0, score = 0;
    var guessed = {}, misses = 0, over = false, won = false;
    var results = [];
    var keyBtns = {};

    function showScreen(name) {
      $("setup-screen").hidden = name !== "setup";
      $("play-screen").hidden = name !== "play";
      $("result-screen").hidden = name !== "result";
      window.scrollTo(0, 0);
    }
    function setupError(msg) {
      $("setup-error").innerHTML = "";
      if (msg) $("setup-error").appendChild(el("div", "notice", msg));
    }
    function showBest() { $("best-line").textContent = "最高分：" + K.bestText("guess"); }

    function start() {
      var items = scope.items();
      if (!items.length) { setupError("请至少选一课。"); return; }
      var seen = {}, list = [];
      var sh = U.shuffled(items);
      for (var i = 0; i < sh.length && list.length < ROUND; i++) {
        var a = answerOf(sh[i].word.es);
        if (!a || seen[a.toLowerCase()]) continue;
        seen[a.toLowerCase()] = true;
        list.push({ item: sh[i], answer: a });
      }
      // 每轮固定 5 个词（满分 30，和最高分可比）；不够就请用户多选几课
      if (list.length < ROUND) {
        setupError("选的范围里只有 " + list.length + " 个可以猜的单词（短语和太短的词不算），每轮需要 " + ROUND + " 个，请多选几课。");
        return;
      }
      setupError("");
      round = list;
      pos = 0;
      score = 0;
      results = [];
      $("h-total").textContent = String(round.length);
      buildKeys();
      showScreen("play");
      showWord();
    }

    function buildKeys() {
      var box = $("keys");
      box.innerHTML = "";
      keyBtns = {};
      for (var i = 0; i < LETTERS.length; i++) {
        (function (L) {
          var b = el("button", "guess-key", L);
          b.type = "button";
          b.setAttribute("aria-label", "字母 " + L);
          b.onclick = function () { guess(L); };
          keyBtns[L] = b;
          box.appendChild(b);
        })(LETTERS[i]);
      }
    }

    function showWord() {
      var r = round[pos];
      guessed = {};
      misses = 0;
      over = false;
      won = false;
      $("h-num").textContent = String(pos + 1);
      $("h-score").textContent = String(score);
      $("q-zh").textContent = r.item.word.zh || "";
      for (var k in keyBtns) {
        keyBtns[k].disabled = false;
        keyBtns[k].className = "guess-key";
      }
      $("feedback").hidden = true;
      $("next-btn").hidden = true;
      drawWord();
    }

    function drawWord() {
      var r = round[pos];
      var box = $("q-word");
      box.innerHTML = "";
      // 字母格按单词长度变窄（CSS 用 --n），字也跟着缩小，最长的词一行也放得下
      var n = r.answer.length;
      box.style.setProperty("--n", String(n));
      var per = box.clientWidth ? (box.clientWidth - (n - 1) * 4) / n : 0;
      var fontPx = per ? Math.min(28, per * 0.95) : 0;
      var shown = "";
      for (var i = 0; i < r.answer.length; i++) {
        var ch = r.answer.charAt(i);
        var open = guessed[base(ch)] || over;
        var s = el("span", "guess-slot" + (over && !guessed[base(ch)] ? " missed" : ""), open ? ch : "");
        if (fontPx) s.style.fontSize = fontPx.toFixed(1) + "px";
        box.appendChild(s);
        shown += open ? ch : "_";
      }
      box.setAttribute("aria-label", shown.split("").join(" "));
      var left = HEARTS - misses;
      var h = "";
      for (var j = 0; j < HEARTS; j++) h += j < left ? "❤️" : "🤍";
      var hb = $("q-hearts");
      hb.textContent = h;
      hb.setAttribute("aria-label", "还剩 " + left + " 次机会");
    }

    function solvedAll() {
      var a = round[pos].answer;
      for (var i = 0; i < a.length; i++) if (!guessed[base(a.charAt(i))]) return false;
      return true;
    }

    function guess(letter) {
      if (over) return;
      var L = base(letter);
      if (LETTERS.indexOf(L) === -1 || guessed[L]) return;
      guessed[L] = true;
      var a = round[pos].answer;
      var hit = false;
      for (var i = 0; i < a.length; i++) if (base(a.charAt(i)) === L) hit = true;
      var kb = keyBtns[L];
      if (kb) {
        kb.disabled = true;
        kb.className = "guess-key " + (hit ? "hit" : "miss");
      }
      if (!hit) misses++;
      if (solvedAll()) end(true);
      else if (misses >= HEARTS) end(false);
      drawWord();
    }

    // 一个词结束：朗读（在点击 / 按键里同步调用）、显示意思和例句
    function end(win) {
      over = true;
      won = win;
      var r = round[pos];
      var w = r.item.word;
      var pts = win ? HEARTS - misses : 0;
      score += pts;
      results.push({ item: r.item, answer: r.answer, win: win, pts: pts });
      for (var k in keyBtns) keyBtns[k].disabled = true;
      if (window.speakSpanish) window.speakSpanish(w.es);
      if (window.Sfx) { if (win) window.Sfx.correct(); else window.Sfx.wrong(); }
      var fb = $("feedback");
      fb.className = "quiz-feedback " + (win ? "is-correct" : "is-wrong");
      fb.innerHTML = "";
      fb.appendChild(el("div", "quiz-feedback-title", win ? "✔ 猜对了！+" + pts + " 分" : "没关系，答案是："));
      var line = el("div", "quiz-feedback-word");
      line.appendChild(U.sayButton(w.es));
      line.appendChild(el("span", "quiz-feedback-zh", w.zh || ""));
      fb.appendChild(line);
      if (w.example && w.example.es) {
        var ex = el("div", "flash-example");
        ex.appendChild(el("div", "flash-example-label", "例句"));
        ex.appendChild(U.sayButton(w.example.es));
        ex.appendChild(el("div", "", w.example.zh || ""));
        fb.appendChild(ex);
      }
      fb.hidden = false;
      $("h-score").textContent = String(score);
      var nb = $("next-btn");
      nb.textContent = pos + 1 < round.length ? "下一个词 →" : "看结果 →";
      nb.hidden = false;
      nb.focus();
    }

    function next() {
      if (!over) return;
      if (pos + 1 < round.length) {
        pos++;
        showWord();
      } else {
        finish();
      }
    }

    function finish() {
      var res = K.record("guess", score, score > 0); // 0 分不给经验值
      if (window.Sfx) window.Sfx.win();
      var wins = 0;
      for (var i = 0; i < results.length; i++) if (results[i].win) wins++;
      $("r-score").textContent = score + " / " + (round.length * HEARTS) + " 分";
      $("r-detail").textContent = "猜出 " + wins + " / " + round.length + " 个词";
      var rec = $("r-record");
      rec.hidden = !(res && res.isRecord && score > 0);
      rec.textContent = res && res.first ? "第一局的成绩就是你的纪录 🎉" : "新纪录！🎉 ";
      $("r-best").textContent = res ? "最高 " + res.best + " 分 · 玩过 " + res.plays + " 次" : "";
      var box = $("r-list");
      box.innerHTML = "";
      var h = el("h2", "", "这一轮的词 ");
      box.appendChild(h);
      var ul = el("ul", "word-list");
      for (var j = 0; j < results.length; j++) {
        var w = results[j].item.word;
        var li = el("li", "quiz-wrong-item");
        li.appendChild(U.sayButton(w.es));
        li.appendChild(document.createTextNode(" — " + (w.zh || "") + " "));
        li.appendChild(el("span", "review-chip " + (results[j].win ? "rate-yes" : "rate-no"), results[j].win ? "+" + results[j].pts : "没猜出"));
        ul.appendChild(li);
      }
      box.appendChild(ul);
      showScreen("result");
      $("again-btn").focus();
    }

    // 实体键盘：直接打字母
    // 用手机键盘猜：点按钮 → 显示输入框并 focus（在点击里同步，iPhone 才弹出键盘）；每打一个字母就猜一次，然后清空
    $("kb-btn").onclick = function () {
      var i = $("kb-input");
      i.hidden = false;
      try { i.focus(); } catch (e) {}
    };
    $("kb-input").addEventListener("input", function () {
      var v = this.value;
      this.value = "";
      for (var c = 0; c < v.length; c++) {
        var ch = v.charAt(c);
        if (/[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]/.test(ch)) guess(ch);
      }
    });
    $("kb-input").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        var nb = $("next-btn");
        if (nb && !nb.hidden) nb.click();
      }
    });
    document.addEventListener("keydown", function (ev) {
      if ($("play-screen").hidden || ev.altKey || ev.ctrlKey || ev.metaKey || K.typing(ev)) return;
      var k = ev.key || "";
      if (k === "Enter") {
        if (over) { ev.preventDefault(); next(); }
        return;
      }
      if (k.length === 1 && LETTERS.indexOf(base(k)) !== -1) {
        ev.preventDefault();
        guess(k);
      }
    });

    $("next-btn").onclick = next;
    $("start-btn").onclick = start;
    $("again-btn").onclick = start;
    $("setup-btn").onclick = function () { showBest(); showScreen("setup"); };

    if (!U.collectWords().length) {
      $("setup-screen").innerHTML = "";
      $("setup-screen").appendChild(el("div", "notice", "没有找到单词内容（data/words.js 没有加载到）。"));
    } else {
      scope = K.scope($("scope-box"), "guess", { words: true, onChange: function () { setupError(""); } });
      showBest();
    }

    // 给自动测试用
    window.__guessAnswerOf = answerOf;
  </script>
</body>
</html>
